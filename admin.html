<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>綠簷後台管理系統</title>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans TC',sans-serif;background:#f0f4f8;color:#1a202c;display:flex;min-height:100vh}
/* Sidebar */
#sidebar{width:240px;min-height:100vh;background:linear-gradient(160deg,#1a3a2a 0%,#14532d 100%);color:#fff;flex-shrink:0;display:flex;flex-direction:column;transition:.3s}
#sidebar .logo{padding:24px 20px;border-bottom:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:12px}
#sidebar .logo i{font-size:1.5rem;color:#4ade80}
#sidebar .logo h1{font-size:1.1rem;font-weight:700}
#sidebar .user-info{padding:16px 20px;border-bottom:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:10px}
#sidebar .user-info .avatar{width:36px;height:36px;border-radius:50%;background:#4ade80;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.9rem;color:#14532d}
#sidebar .user-info .meta .name{font-size:.9rem;font-weight:600}
#sidebar .user-info .meta .role-badge{font-size:.7rem;padding:2px 8px;border-radius:99px;background:rgba(74,222,128,.2);color:#4ade80;margin-top:2px;display:inline-block}
#sidebar nav{flex:1;padding:12px 0;overflow-y:auto}
.nav-group{margin-bottom:4px}
.nav-group .group-label{font-size:.65rem;text-transform:uppercase;letter-spacing:.1em;color:rgba(255,255,255,.4);padding:12px 20px 4px}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 20px;cursor:pointer;transition:.2s;border-radius:0;color:rgba(255,255,255,.75);font-size:.875rem}
.nav-item:hover{background:rgba(255,255,255,.08);color:#fff}
.nav-item.active{background:rgba(74,222,128,.15);color:#4ade80;border-right:3px solid #4ade80}
.nav-item i{width:18px;text-align:center}
#sidebar .logout-btn{padding:16px 20px;border-top:1px solid rgba(255,255,255,.1)}
#sidebar .logout-btn button{width:100%;padding:8px;border-radius:8px;background:rgba(239,68,68,.1);color:#fca5a5;border:1px solid rgba(239,68,68,.2);cursor:pointer;font-size:.85rem;transition:.2s}
#sidebar .logout-btn button:hover{background:rgba(239,68,68,.2)}
/* Main */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden}
#topbar{background:#fff;padding:0 24px;height:60px;display:flex;align-items:center;justify-between;border-bottom:1px solid #e2e8f0;box-shadow:0 1px 3px rgba(0,0,0,.05)}
#topbar h2{font-size:1.1rem;font-weight:700;color:#1a202c}
#topbar .actions{display:flex;align-items:center;gap:12px}
#content{flex:1;overflow-y:auto;padding:24px}
/* Pages */
.page{display:none}.page.active{display:block}
/* Cards */
.card{background:#fff;border-radius:12px;padding:20px;box-shadow:0 1px 4px rgba(0,0,0,.06);margin-bottom:20px}
.card h3{font-size:1rem;font-weight:700;margin-bottom:16px;color:#1a202c}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;margin-bottom:20px}
.stat-card{background:#fff;border-radius:12px;padding:20px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.stat-card .val{font-size:2rem;font-weight:800;color:#166534}
.stat-card .label{font-size:.8rem;color:#6b7280;margin-top:4px}
/* Table */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.875rem}
th{background:#f8fafc;padding:10px 14px;text-align:left;font-weight:600;color:#4b5563;border-bottom:1px solid #e2e8f0}
td{padding:12px 14px;border-bottom:1px solid #f1f5f9;vertical-align:middle}
tr:hover td{background:#fafafa}
/* Buttons */
.btn{padding:8px 16px;border-radius:8px;font-size:.85rem;cursor:pointer;border:none;font-family:inherit;transition:.2s;font-weight:500}
.btn-green{background:#16a34a;color:#fff}.btn-green:hover{background:#15803d}
.btn-red{background:#dc2626;color:#fff}.btn-red:hover{background:#b91c1c}
.btn-blue{background:#2563eb;color:#fff}.btn-blue:hover{background:#1d4ed8}
.btn-gray{background:#f1f5f9;color:#374151}.btn-gray:hover{background:#e2e8f0}
.btn-sm{padding:4px 10px;font-size:.75rem;border-radius:6px}
/* Badges */
.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:.7rem;font-weight:600}
.badge-green{background:#dcfce7;color:#166534}
.badge-blue{background:#dbeafe;color:#1e40af}
.badge-red{background:#fee2e2;color:#991b1b}
.badge-yellow{background:#fef9c3;color:#854d0e}
.badge-purple{background:#f3e8ff;color:#6b21a8}
.badge-gray{background:#f1f5f9;color:#4b5563}
/* Form */
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:.85rem;font-weight:600;color:#374151;margin-bottom:6px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:9px 12px;border:1px solid #d1d5db;border-radius:8px;font-size:.875rem;font-family:inherit;outline:none;transition:.2s}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:#16a34a;box-shadow:0 0 0 3px rgba(22,163,74,.1)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;display:none;align-items:center;justify-content:center;padding:16px}
.modal-overlay.open{display:flex}
.modal{background:#fff;border-radius:16px;width:100%;max-width:600px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal-header{padding:20px 24px;border-bottom:1px solid #e2e8f0;display:flex;justify-content:space-between;align-items:center}
.modal-header h3{font-weight:700;font-size:1.1rem}
.modal-body{padding:24px}
.modal-footer{padding:16px 24px;border-top:1px solid #e2e8f0;display:flex;justify-content:flex-end;gap:8px}
/* Login */
#login-screen{position:fixed;inset:0;background:linear-gradient(135deg,#14532d,#166534);z-index:2000;display:flex;align-items:center;justify-content:center}
#login-box{background:#fff;border-radius:20px;padding:40px;width:360px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
#login-box h2{text-align:center;margin-bottom:24px;color:#14532d}
/* Rich text */
#rte-toolbar{border:1px solid #d1d5db;border-bottom:none;border-radius:8px 8px 0 0;padding:8px;display:flex;flex-wrap:wrap;gap:4px}
#rte-toolbar button{padding:4px 10px;border:1px solid #d1d5db;border-radius:4px;background:#f9fafb;cursor:pointer;font-size:.8rem}
#rte-toolbar button:hover{background:#e5e7eb}
#rte-content{border:1px solid #d1d5db;border-radius:0 0 8px 8px;min-height:200px;padding:12px;outline:none;font-size:.9rem;line-height:1.6}
/* Owner only */
.owner-only{display:none}
.is-owner .owner-only{display:flex}
/* Responsive */
@media(max-width:768px){#sidebar{width:60px}#sidebar .logo h1,#sidebar .user-info .meta,.nav-item span,.nav-group .group-label,#sidebar .logout-btn button span{display:none}#sidebar .logo{justify-content:center}#sidebar .user-info{justify-content:center}#main{overflow:auto}}
</style>
</head>
<body>
<!-- Login Screen -->
<div id="login-screen">
  <div id="login-box">
    <div style="text-align:center;margin-bottom:20px"><i class="fa fa-leaf" style="font-size:2.5rem;color:#16a34a"></i></div>
    <h2>綠簷後台管理系統</h2>
    <div class="form-group"><label>電子郵件</label><input id="login-email" type="email" placeholder="admin@example.com"></div>
    <div class="form-group"><label>密碼</label><input id="login-pass" type="password" placeholder="••••••••"></div>
    <button id="login-btn" class="btn btn-green" style="width:100%;padding:12px;font-size:1rem">登入後台</button>
    <p id="login-err" style="color:#dc2626;font-size:.8rem;text-align:center;margin-top:8px;display:none"></p>
  </div>
</div>

<!-- Sidebar -->
<nav id="sidebar">
  <div class="logo"><i class="fa fa-leaf"></i><h1>綠簷後台</h1></div>
  <div class="user-info">
    <div class="avatar" id="user-avatar">A</div>
    <div class="meta"><div class="name" id="user-name">管理員</div><div class="role-badge" id="role-badge">admin</div></div>
  </div>
  <nav>
    <div class="nav-group">
      <div class="group-label">核心</div>
      <div class="nav-item active" data-page="dashboard"><i class="fa fa-dashboard"></i><span>儀表板</span></div>
      <div class="nav-item" data-page="shops"><i class="fa fa-store" style="font-size:14px">&#xf07a;</i><span>商店管理</span></div>
      <div class="nav-item" data-page="reports"><i class="fa fa-flag"></i><span>查看問題</span></div>
    </div>
    <div class="nav-group">
      <div class="group-label">內容</div>
      <div class="nav-item" data-page="newsletter"><i class="fa fa-envelope"></i><span>電子報</span></div>
      <div class="nav-item" data-page="announcements"><i class="fa fa-bullhorn"></i><span>公告</span></div>
      <div class="nav-item" data-page="policy"><i class="fa fa-file-text"></i><span>政策</span></div>
    </div>
    <div class="nav-group">
      <div class="group-label">功能</div>
      <div class="nav-item" data-page="badges"><i class="fa fa-certificate"></i><span>賦予徽章</span></div>
      <div class="nav-item owner-only" data-page="users"><i class="fa fa-users"></i><span>管理使用者</span></div>
      <div class="nav-item" data-page="trash"><i class="fa fa-trash"></i><span>垃圾桶</span></div>
    </div>
  </nav>
  <div class="logout-btn"><button id="logout-btn"><i class="fa fa-sign-out"></i> <span>登出</span></button></div>
</nav>

<!-- Main Content -->
<div id="main">
  <div id="topbar">
    <h2 id="page-title">儀表板</h2>
    <div class="actions" id="topbar-actions"></div>
  </div>
  <div id="content">

    <!-- DASHBOARD -->
    <div class="page active" id="page-dashboard">
      <div class="stat-grid" id="stat-grid"></div>
      <div style="display:grid;grid-template-columns:2fr 1fr;gap:20px">
        <div class="card"><h3>訪問趨勢 (PV)</h3><canvas id="trend-chart" height="200"></canvas></div>
        <div class="card"><h3>訂閱來源</h3><canvas id="source-chart"></canvas></div>
      </div>
    </div>

    <!-- SHOPS -->
    <div class="page" id="page-shops">
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
          <div style="display:flex;gap:8px">
            <input id="shop-search" class="btn btn-gray" style="padding:8px 12px;border:1px solid #d1d5db;border-radius:8px;width:220px" placeholder="搜尋商店...">
            <label class="btn btn-blue" style="cursor:pointer"><i class="fa fa-upload"></i> 匯入CSV <input type="file" id="csv-input" accept=".csv" style="display:none"></label>
          </div>
          <button class="btn btn-green" onclick="openShopModal()"><i class="fa fa-plus"></i> 新增商店</button>
        </div>
        <div class="table-wrap"><table>
          <thead><tr><th>名稱</th><th>類型</th><th>狀態</th><th>推薦</th><th>操作</th></tr></thead>
          <tbody id="shops-tbody"></tbody>
        </table></div>
      </div>
    </div>

    <!-- REPORTS -->
    <div class="page" id="page-reports">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">
        <div class="card"><h3><i class="fa fa-flag" style="color:#dc2626"></i> 檢舉紀錄</h3><div id="reports-list"></div></div>
        <div class="card"><h3><i class="fa fa-comment" style="color:#2563eb"></i> 問題回報</h3><div id="issues-list"></div></div>
      </div>
    </div>

    <!-- NEWSLETTER -->
    <div class="page" id="page-newsletter">
      <div class="card">
        <h3>訂閱者列表 (<span id="sub-count">0</span> 人)</h3>
        <div class="table-wrap"><table>
          <thead><tr><th>Email</th><th>訂閱時間</th><th>操作</th></tr></thead>
          <tbody id="newsletter-tbody"></tbody>
        </table></div>
      </div>
    </div>

    <!-- ANNOUNCEMENTS -->
    <div class="page" id="page-announcements">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">
        <div class="card">
          <h3>編輯公告</h3>
          <div class="form-group"><label>標題</label><input id="ann-title" placeholder="公告標題"></div>
          <div class="form-group"><label>內容 (富文本)</label>
            <div id="rte-toolbar">
              <button onclick="fmt('bold')"><b>B</b></button>
              <button onclick="fmt('italic')"><i>I</i></button>
              <button onclick="fmt('underline')"><u>U</u></button>
              <button onclick="fmtLink()"><i class="fa fa-link"></i></button>
              <button onclick="fmt('insertUnorderedList')">• 列表</button>
            </div>
            <div id="rte-content" contenteditable="true"></div>
          </div>
          <button class="btn btn-green" onclick="saveAnnouncement()">發布公告</button>
        </div>
        <div class="card"><h3>歷史公告</h3><div id="ann-list"></div></div>
      </div>
    </div>

    <!-- POLICY -->
    <div class="page" id="page-policy">
      <div class="card">
        <h3>編輯政策文件</h3>
        <div class="form-group">
          <label>選擇文件</label>
          <select id="policy-type">
            <option value="privacy">隱私權政策</option>
            <option value="disclaimer">免責聲明</option>
          </select>
        </div>
        <div class="form-group"><label>內容</label><textarea id="policy-content" rows="12" style="resize:vertical"></textarea></div>
        <div style="display:flex;justify-content:space-between;align-items:center">
          <button class="btn btn-gray" onclick="loadPolicyHistory()"><i class="fa fa-history"></i> 查看版本紀錄</button>
          <button class="btn btn-green" onclick="savePolicy()">儲存並發布</button>
        </div>
        <div id="policy-history" style="margin-top:16px;display:none"></div>
      </div>
    </div>

    <!-- BADGES -->
    <div class="page" id="page-badges">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">
        <div class="card">
          <h3>新增徽章</h3>
          <div class="form-group"><label>徽章名稱</label><input id="badge-name" placeholder="例：早鳥用戶"></div>
          <div class="form-group"><label>Emoji 圖示</label><input id="badge-icon" placeholder="例：🌿"></div>
          <div class="form-group"><label>描述</label><input id="badge-desc" placeholder="描述此徽章的意義"></div>
          <button class="btn btn-green" onclick="saveBadge()"><i class="fa fa-save"></i> 儲存徽章</button>
          <hr style="margin:20px 0">
          <h3>頒發徽章</h3>
          <div class="form-group"><label>使用者 UID</label><input id="grant-uid" placeholder="貼上使用者 UID"></div>
          <div class="form-group"><label>選擇徽章</label><select id="grant-badge-select"></select></div>
          <button class="btn btn-blue" onclick="grantBadge()"><i class="fa fa-gift"></i> 頒發</button>
        </div>
        <div class="card"><h3>現有徽章庫</h3><div id="badges-list"></div></div>
      </div>
    </div>

    <!-- USERS (Owner only) -->
    <div class="page" id="page-users">
      <div class="card">
        <h3>使用者管理 (僅版主可見)</h3>
        <div class="table-wrap"><table>
          <thead><tr><th>UID</th><th>角色</th><th>狀態</th><th>操作</th></tr></thead>
          <tbody id="users-tbody"></tbody>
        </table></div>
      </div>
    </div>

    <!-- TRASH -->
    <div class="page" id="page-trash">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">
        <div class="card"><h3><i class="fa fa-store" style="font-size:14px">&#xf07a;</i> 被封禁的商店</h3><div id="trash-shops"></div></div>
        <div class="card"><h3><i class="fa fa-user-times"></i> 被封禁的使用者</h3><div id="trash-users"></div></div>
      </div>
    </div>

  </div>
</div>

<!-- Shop Modal -->
<div class="modal-overlay" id="shop-modal">
  <div class="modal">
    <div class="modal-header">
      <h3 id="shop-modal-title">新增商店</h3>
      <button class="btn btn-gray btn-sm" onclick="closeModal('shop-modal')">✕</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="shop-edit-id">
      <div class="form-row">
        <div class="form-group"><label>商店名稱 (中文)</label><input id="s-name-zh" placeholder="永續好店"></div>
        <div class="form-group"><label>商店名稱 (英文)</label><input id="s-name-en" placeholder="Eco Shop"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>類型 (中文)</label><input id="s-type-zh" placeholder="餐廳"></div>
        <div class="form-group"><label>地址 (中文)</label><input id="s-addr-zh" placeholder="台北市..."></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>緯度</label><input id="s-lat" type="number" step="any" placeholder="25.0330"></div>
        <div class="form-group"><label>經度</label><input id="s-lng" type="number" step="any" placeholder="121.5654"></div>
      </div>
      <div class="form-group"><label>描述 (中文)</label><textarea id="s-desc-zh" rows="3"></textarea></div>
      <div class="form-group"><label>營業時間</label><input id="s-hours" placeholder="週一至五 10:00-20:00"></div>
      <div class="form-row">
        <div class="form-group"><label>永續特點 (逗號分隔)</label><input id="s-eco" placeholder="減塑包裝,在地食材"></div>
        <div class="form-group"><label>狀態</label>
          <select id="s-status"><option value="active">上架</option><option value="hidden">隱藏</option></select>
        </div>
      </div>
      <div class="form-group" style="display:flex;align-items:center;gap:8px">
        <input type="checkbox" id="s-featured" style="width:auto">
        <label for="s-featured" style="margin:0">設為精選推薦店</label>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-gray" onclick="closeModal('shop-modal')">取消</button>
      <button class="btn btn-green" onclick="saveShop()">儲存</button>
    </div>
  </div>
</div>

<script src="js/firebase-config.js"></script>
<script src="js/admin/main.js"></script>
<script src="js/admin/auth.js"></script>
<script src="js/admin/dashboard.js"></script>
<script src="js/admin/shops.js"></script>
<script src="js/admin/content.js"></script>
<script src="js/admin/users.js"></script>
</body>
</html>
