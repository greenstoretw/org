<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>永續商店地圖 - 後台管理系統</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics-compat.js"></script>
    
    <!-- 引入Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <!-- 引入Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
    <!-- 引入FileSaver.js用於導出功能 -->
    <script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
    <!-- Tailwind配置 -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#165DFF',
                        secondary: '#36CFC9',
                        success: '#52C41A',
                        warning: '#FAAD14',
                        danger: '#FF4D4F',
                        dark: '#1D2129',
                        'dark-2': '#4E5969',
                        'light-1': '#F2F3F5',
                        'light-2': '#E5E6EB',
                        'light-3': '#C9CDD4'
                    },
                    fontFamily: {
                        inter: ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .card-shadow {
                box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            }
            .card-hover {
                transition: all 0.3s ease;
            }
            .card-hover:hover {
                transform: translateY(-5px);
                box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
            }
            .gradient-bg {
                background: linear-gradient(135deg, #165DFF 0%, #0A4BDB 100%);
            }
            .stat-card {
                @apply bg-white rounded-xl p-6 card-shadow card-hover;
            }
            .chart-container {
                @apply bg-white rounded-xl p-6 card-shadow;
            }
            .btn-primary {
                @apply bg-primary text-white px-4 py-2 rounded-lg hover:bg-primary/90 transition-all duration-300;
            }
            .btn-secondary {
                @apply bg-light-1 text-dark px-4 py-2 rounded-lg hover:bg-light-2 transition-all duration-300;
            }
            .nav-item {
                @apply flex items-center gap-2 px-4 py-3 rounded-lg transition-all duration-200 hover:bg-light-1;
            }
            .nav-item.active {
                @apply bg-primary/10 text-primary font-medium;
            }
        }
    </style>
</head>
<body class="bg-gray-50 font-inter text-dark min-h-screen flex flex-col">
    <!-- 登入介面 (默認隱藏) -->
    <div id="login-overlay" class="fixed inset-0 bg-dark/90 z-[100] flex items-center justify-center hidden">
        <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md">
            <h2 class="text-2xl font-bold mb-6 text-center">管理員登入</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-dark-2 mb-1">帳號</label>
                    <input id="admin-user" type="text" class="w-full px-4 py-2 border border-light-2 rounded-lg focus:ring-2 focus:ring-primary/50 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-dark-2 mb-1">密碼</label>
                    <input id="admin-pass" type="password" class="w-full px-4 py-2 border border-light-2 rounded-lg focus:ring-2 focus:ring-primary/50 outline-none">
                </div>
                <button id="do-login" class="w-full btn-primary py-3 font-bold mt-4">進入後台</button>
                <p id="login-error" class="text-danger text-sm text-center hidden mt-2"></p>
            </div>
        </div>
    </div>

    <!-- 主要內容容器 -->
    <div id="admin-content" class="flex flex-col min-h-screen">
        <!-- 頂部導航欄 -->
        <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="container mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <!-- 品牌標識 -->
                <div class="flex items-center">
                    <div class="flex-shrink-0 gradient-bg text-white p-2 rounded-lg">
                        <i class="fa fa-line-chart text-xl"></i>
                    </div>
                    <div class="ml-3">
                        <h1 class="text-xl font-bold">永續商店後台</h1>
                    </div>
                </div>
                
                <!-- 搜索框 -->
                <div class="hidden md:block flex-1 max-w-md mx-8">
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fa fa-search text-light-3"></i>
                        </div>
                        <input id="search-input" type="text" placeholder="搜尋日期、渠道或指標..." class="block w-full pl-10 pr-3 py-2 border border-light-2 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary transition-all">
                    </div>
                </div>
                
                <!-- 用戶區域 -->
                <div class="flex items-center">
                    <button id="export-btn" class="btn-primary mr-4 hidden sm:flex items-center gap-2">
                        <i class="fa fa-download"></i>
                        <span>導出報表</span>
                    </button>
                    <div class="relative">
                        <button class="flex items-center gap-2 focus:outline-none">
                            <img class="h-8 w-8 rounded-full object-cover" src="https://picsum.photos/id/1005/200/200" alt="用戶頭像">
                            <span class="hidden sm:inline font-medium">管理員</span>
                            <i class="fa fa-angle-down text-light-3"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- 主要內容區域 -->
    <main class="flex-1 container mx-auto px-4 sm:px-6 lg:px-8 py-6">
        <!-- 頁面標題和過濾器 -->
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4">
            <div>
                <h2 class="text-[clamp(1.5rem,3vw,2rem)] font-bold">訪問統計報表</h2>
                <p class="text-dark-2 mt-1">實時監控網站訪問數據和用戶行為</p>
            </div>
            
            <div class="flex flex-wrap gap-3">
                <div class="relative">
                    <select id="date-range" class="appearance-none bg-white border border-light-2 rounded-lg pl-4 pr-10 py-2 focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary transition-all">
                        <option value="7days" selected="">近7天</option>
                        <option value="30days">近30天</option>
                    </select>
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-light-3">
                        <i class="fa fa-calendar"></i>
                    </div>
                </div>
                
                <button id="refresh-btn" class="btn-secondary flex items-center gap-2">
                    <i class="fa fa-refresh"></i>
                    <span>刷新</span>
                </button>
            </div>
        </div>
        
        <!-- KPI指標卡片 -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 mb-6">
            <!-- PV (頁面瀏覽量) -->
            <div class="stat-card">
                <div class="flex justify-between items-start mb-4">
                    <div>
                        <p class="text-dark-2 text-sm">頁面瀏覽量 (PV)</p>
                        <h3 id="pv-value" class="text-3xl font-bold mt-1">0</h3>
                    </div>
                    <div class="bg-primary/10 p-3 rounded-lg">
                        <i class="fa fa-eye text-primary text-xl"></i>
                    </div>
                </div>
                <div class="flex items-center">
                    <span id="pv-change" class="text-success flex items-center">
                        <i class="fa fa-arrow-up mr-1"></i>
                        <span>0%</span>
                    </span>
                    <span class="text-dark-2 text-sm ml-2">較上期</span>
                </div>
            </div>
            
            <!-- UV (獨立訪客) -->
            <div class="stat-card">
                <div class="flex justify-between items-start mb-4">
                    <div>
                        <p class="text-dark-2 text-sm">獨立訪客 (UV)</p>
                        <h3 id="uv-value" class="text-3xl font-bold mt-1">0</h3>
                    </div>
                    <div class="bg-secondary/10 p-3 rounded-lg">
                        <i class="fa fa-user text-secondary text-xl"></i>
                    </div>
                </div>
                <div class="flex items-center">
                    <span id="uv-change" class="text-success flex items-center">
                        <i class="fa fa-arrow-up mr-1"></i>
                        <span>0%</span>
                    </span>
                    <span class="text-dark-2 text-sm ml-2">較上期</span>
                </div>
            </div>
            
            <!-- 平均訪問時長 -->
            <div class="stat-card">
                <div class="flex justify-between items-start mb-4">
                    <div>
                        <p class="text-dark-2 text-sm">平均訪問時長</p>
                        <h3 id="avg-time-value" class="text-3xl font-bold mt-1">00:00</h3>
                    </div>
                    <div class="bg-warning/10 p-3 rounded-lg">
                        <i class="fa fa-clock-o text-warning text-xl"></i>
                    </div>
                </div>
                <div class="flex items-center">
                    <span id="time-change" class="text-danger flex items-center">
                        <i class="fa fa-arrow-down mr-1"></i>
                        <span>0%</span>
                    </span>
                    <span class="text-dark-2 text-sm ml-2">較上期</span>
                </div>
            </div>
            
            <!-- 跳出率 -->
            <div class="stat-card">
                <div class="flex justify-between items-start mb-4">
                    <div>
                        <p class="text-dark-2 text-sm">跳出率</p>
                        <h3 id="bounce-rate-value" class="text-3xl font-bold mt-1">0%</h3>
                    </div>
                    <div class="bg-danger/10 p-3 rounded-lg">
                        <i class="fa fa-sign-out text-danger text-xl"></i>
                    </div>
                </div>
                <div class="flex items-center">
                    <span id="bounce-change" class="text-success flex items-center">
                        <i class="fa fa-arrow-down mr-1"></i>
                        <span>0%</span>
                    </span>
                    <span class="text-dark-2 text-sm ml-2">較上期</span>
                </div>
            </div>
        </div>
        
        <!-- 圖表區域 -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-6">
            <!-- 訪問趨勢圖 -->
            <div class="lg:col-span-2 chart-container">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-lg font-semibold">訪問趨勢</h3>
                    <div class="flex gap-2">
                        <button class="trend-filter px-3 py-1 rounded-full text-sm bg-primary text-white">PV</button>
                        <button class="trend-filter px-3 py-1 rounded-full text-sm bg-light-1 text-dark-2 hover:bg-light-2 transition-colors">UV</button>
                    </div>
                </div>
                <div class="h-[350px]">
                    <canvas id="trend-chart"></canvas>
                </div>
            </div>
            
            <!-- 來源渠道餅圖 -->
            <div class="chart-container">
                <h3 class="text-lg font-semibold mb-6">訪問來源渠道</h3>
                <div class="h-[350px] flex items-center justify-center">
                    <canvas id="sources-chart"></canvas>
                </div>
            </div>
        </div>
        
        <!-- 詳細數據表格 -->
        <div class="chart-container mb-6">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-lg font-semibold">訪問詳情數據</h3>
            </div>
            
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-light-2">
                    <thead>
                        <tr>
                            <th class="px-4 py-3 bg-light-1 text-left text-xs font-medium text-dark-2 uppercase tracking-wider rounded-tl-lg">日期</th>
                            <th class="px-4 py-3 bg-light-1 text-left text-xs font-medium text-dark-2 uppercase tracking-wider">來源渠道</th>
                            <th class="px-4 py-3 bg-light-1 text-left text-xs font-medium text-dark-2 uppercase tracking-wider">PV</th>
                            <th class="px-4 py-3 bg-light-1 text-left text-xs font-medium text-dark-2 uppercase tracking-wider">UV</th>
                            <th class="px-4 py-3 bg-light-1 text-left text-xs font-medium text-dark-2 uppercase tracking-wider">平均訪問時長</th>
                            <th class="px-4 py-3 bg-light-1 text-left text-xs font-medium text-dark-2 uppercase tracking-wider rounded-tr-lg">跳出率</th>
                        </tr>
                    </thead>
                    <tbody id="data-table-body" class="bg-white divide-y divide-light-2">
                    </tbody>
                </table>
            </div>
        </div>
        <!-- 成員權限管理 (新功能) -->
        <div class="mt-12">
            <h2 class="text-2xl font-bold mb-6">成員權限管理</h2>
            <div class="chart-container">
                <table class="w-full">
                    <thead>
                        <tr class="text-left border-b border-light-2">
                            <th class="px-4 py-3 text-dark-2 font-medium">用戶 ID</th>
                            <th class="px-4 py-3 text-dark-2 font-medium">目前角色</th>
                            <th class="px-4 py-3 text-dark-2 font-medium">操作</th>
                        </tr>
                    </thead>
                    <tbody id="user-table-body">
                        <!-- 由 JS 動態填充 -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <footer class="bg-white border-t border-light-2 py-6">
        <div class="container mx-auto px-4 sm:px-6 lg:px-8">
            <p class="text-dark-2 text-sm text-center">© 2025 永續商店分析平台. 保留所有權利.</p>
        </div>
    </footer>

    <script src="js/firebase-config.js"></script>
    <script>
    <script src="js/firebase-config.js"></script>
    <script>
        let allData = [];
        let channels = [
            { id: 'direct', name: '直接訪問', color: '#165DFF' },
            { id: 'search', name: '搜尋引擎', color: '#36CFC9' },
            { id: 'social', name: '社交媒體', color: '#52C41A' },
            { id: 'external', name: '外部連結', color: '#FAAD14' },
            { id: 'ads', name: '廣告推廣', color: '#FF4D4F' }
        ];

        async function fetchAnalytics(currentUserRole) {
            try {
                const snapshot = await db.collection('analytics').orderBy('Date', 'desc').limit(30).get();
                allData = snapshot.docs.map(doc => doc.data());
                
                // 計算 KPI
                let pv = 0, uv = 0, dur = 0, br = 0;
                allData.forEach(r => { pv += Number(r.PV); uv += Number(r.UV); dur += Number(r.Duration); br += Number(r.BounceRate); });
                const count = allData.length || 1;
                
                renderKPI({
                    pv, uv, avgDuration: Math.floor(dur/count), avgBounceRate: (br/count).toFixed(1),
                    changes: { pv: 12.5, uv: 8.2, duration: 2.1, bounce: -0.5 } // 模擬增長
                });
                renderTrendChart(allData);
                renderSourcesChart(allData);
                renderTable(allData);
                fetchUsers(currentUserRole); // 傳遞角色以渲染正確的 UI
                document.getElementById('login-overlay').classList.add('hidden');
            } catch (err) {
                console.error("Error fetching analytics:", err);
            }
        }

        async function fetchUsers(currentUserRole) {
            try {
                const snapshot = await db.collection('users').limit(20).get();
                const body = document.getElementById('user-table-body');
                body.innerHTML = '';
                snapshot.forEach(doc => {
                    const user = doc.data();
                    let roleLabel = '一般用戶';
                    let roleColor = 'bg-gray-100 text-gray-800';
                    if (user.role === 'admin') { roleLabel = '管理員'; roleColor = 'bg-primary/10 text-primary'; }
                    if (user.role === 'owner') { roleLabel = '版主'; roleColor = 'bg-purple-100 text-purple-800 font-bold'; }

                    const row = document.createElement('tr');
                    let actionHtml = '';
                    
                    if (currentUserRole === 'owner') {
                        actionHtml = `
                            <select onchange="updateUserRole('${doc.id}', this.value)" class="text-sm border border-light-2 rounded px-2 py-1 focus:ring-primary outline-none">
                                <option value="user" ${user.role !== 'admin' && user.role !== 'owner' ? 'selected' : ''}>設為一般用戶</option>
                                <option value="admin" ${user.role === 'admin' ? 'selected' : ''}>設為管理員</option>
                                <option value="owner" ${user.role === 'owner' ? 'selected' : ''}>設為版主</option>
                            </select>
                        `;
                    } else {
                        actionHtml = `<span class="text-sm text-gray-400">無權限更改</span>`;
                    }

                    row.innerHTML = `
                        <td class="px-4 py-4 font-mono text-sm">${doc.id}</td>
                        <td class="px-4 py-4">
                            <span class="px-2 py-1 rounded text-xs ${roleColor}">
                                ${roleLabel}
                            </span>
                        </td>
                        <td class="px-4 py-4">
                            ${actionHtml}
                        </td>
                    `;
                    body.appendChild(row);
                });
            } catch (err) {
                console.error("Error fetching users:", err);
            }
        }

        async function updateUserRole(uid, newRole) {
            if (!confirm(`確定要將此用戶設為 ${newRole} 嗎？`)) return;
            try {
                await db.collection('users').doc(uid).update({ role: newRole });
                alert("權限更新成功！");
                fetchUsers();
            } catch (err) {
                alert("更新失敗: " + err.message);
            }
        }

        function refreshData() {
            const user = auth.currentUser;
            if (!user) {
                document.getElementById('login-overlay').classList.remove('hidden');
                return;
            }
            
            // 檢查管理員或版主權限
            db.collection('users').doc(user.uid).get().then(doc => {
                if (doc.exists && (doc.data().role === 'admin' || doc.data().role === 'owner')) {
                    document.getElementById('login-overlay').classList.add('hidden');
                    const currentRole = doc.data().role;
                    
                    // 根據角色顯示不同歡迎語
                    document.querySelector('.container .hidden.sm\\:inline').textContent = currentRole === 'owner' ? '最高版主' : '管理員';
                    
                    fetchAnalytics(currentRole);
                } else {
                    alert("您沒有管理員權限");
                    auth.signOut();
                }
            });
        }

        document.getElementById('do-login').addEventListener('click', async () => {
            const email = document.getElementById('admin-user').value;
            const password = document.getElementById('admin-pass').value;
            const errorEl = document.getElementById('login-error');
            
            try {
                await auth.signInWithEmailAndPassword(email, password);
                refreshData();
            } catch (err) {
                errorEl.textContent = "登入失敗: " + err.message;
                errorEl.classList.remove('hidden');
            }
        });

        // 監聽 Auth 狀態
        auth.onAuthStateChanged(user => {
            if (user) {
                refreshData();
            } else {
                document.getElementById('login-overlay').classList.remove('hidden');
            }
        });

        function formatNumber(num) {
            return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
        }
        
        function formatTime(seconds) {
            const hours = Math.floor(seconds / 3600);
            const minutes = Math.floor((seconds % 3600) / 60);
            const secs = seconds % 60;
            return hours > 0 ? `${hours}:${minutes.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}` : `${minutes}:${secs.toString().padStart(2, '0')}`;
        }

        function renderKPI(kpiData) {
            document.getElementById('pv-value').textContent = formatNumber(kpiData.pv);
            document.getElementById('uv-value').textContent = formatNumber(kpiData.uv);
            document.getElementById('avg-time-value').textContent = formatTime(kpiData.avgDuration);
            document.getElementById('bounce-rate-value').textContent = `${kpiData.avgBounceRate}%`;
            
            const renderChange = (id, val) => {
                const el = document.getElementById(id);
                const pos = val >= 0;
                el.className = pos ? 'text-success flex items-center' : 'text-danger flex items-center';
                el.innerHTML = `<i class="fa fa-arrow-${pos ? 'up' : 'down'} mr-1"></i><span>${Math.abs(val).toFixed(1)}%</span>`;
            };
            renderChange('pv-change', kpiData.changes.pv);
            renderChange('uv-change', kpiData.changes.uv);
            renderChange('time-change', kpiData.changes.duration);
            renderChange('bounce-change', kpiData.changes.bounce);
        }

        function renderTrendChart(data) {
            const ctx = document.getElementById('trend-chart').getContext('2d');
            const dates = [...new Set(data.map(i => i.Date))];
            const pvData = dates.map(d => data.filter(i => i.Date === d).reduce((s, i) => s + Number(i.PV), 0));
            
            if (window.trendChartInstance) window.trendChartInstance.destroy();
            window.trendChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: dates,
                    datasets: [{
                        label: 'PV',
                        data: pvData,
                        borderColor: '#165DFF',
                        backgroundColor: 'rgba(22, 93, 255, 0.1)',
                        fill: true,
                        tension: 0.3
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });
        }

        function renderSourcesChart(data) {
            const ctx = document.getElementById('sources-chart').getContext('2d');
            const channelValues = channels.map(c => {
                return data.filter(i => i.Channel === c.id || i.Channel === c.name).reduce((s, i) => s + Number(i.PV), 0);
            });

            if (window.sourcesChartInstance) window.sourcesChartInstance.destroy();
            window.sourcesChartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: channels.map(c => c.name),
                    datasets: [{
                        data: channelValues,
                        backgroundColor: channels.map(c => c.color)
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false, cutout: '70%' }
            });
        }

        function renderTable(data) {
            const body = document.getElementById('data-table-body');
            body.innerHTML = '';
            data.forEach(item => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td class="px-4 py-4">${item.Date}</td>
                    <td class="px-4 py-4">${item.Channel}</td>
                    <td class="px-4 py-4">${item.PV}</td>
                    <td class="px-4 py-4">${item.UV}</td>
                    <td class="px-4 py-4">${formatTime(item.Duration)}</td>
                    <td class="px-4 py-4">${item.BounceRate}%</td>
                `;
                body.appendChild(row);
            });
        }

        document.getElementById('refresh-btn').addEventListener('click', refreshData);
        document.addEventListener('DOMContentLoaded', refreshData);
    </script>
</body>
</html>
